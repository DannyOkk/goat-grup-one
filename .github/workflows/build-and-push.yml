name: Build and Push to ACR

# Push a main -> automático. workflow_dispatch -> botón "Run workflow" en la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.ACR_REGISTRY }}

permissions:
  contents: read # solo leemos el código; no usamos OIDC, así que no hace falta id-token

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Traer el repo (incluye el Dockerfile de la raíz).
      - name: Checkout
        uses: actions/checkout@v7

      # 2. Nombre de imagen (repo dinámico desde el contexto) + SHA corto de 7 chars.
      #    Se exportan a $GITHUB_ENV para no repetir las expresiones más abajo.
      - name: Set image vars
        run: |
          echo "IMAGE=$REGISTRY/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # 3. Login a Azure con el Service Principal. La action oficial parsea el
      #    JSON, hace el az login y limpia la sesión en un post-step.
      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 4. Login al ACR reutilizando la sesión del paso anterior (mismo SP,
      #    sin usuario admin). ${REGISTRY%%.*} = REGISTRY sin el .azurecr.io
      - name: Login to ACR
        run: az acr login --name "${REGISTRY%%.*}"

      # 5. Build con los dos tags de una sola pasada (una imagen, dos nombres)
      #    y push de ambos: acringenieria.azurecr.io/<repo>:<sha> y :latest
      - name: Build and push
        run: |
          docker build -t "$IMAGE:$SHORT_SHA" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"

      # 6. Deploy a Azure Container Apps con la imagen recién pusheada
      #    (tag del SHA corto, no :latest, para que cada deploy sea explícito
      #    sobre qué commit está corriendo). Crea el Container App (y su
      #    entorno, si no existe todavía) o actualiza uno existente.
      #    Se salta si el mensaje del commit incluye "/notdeploy".
      - name: Deploy to Azure Container Apps
        if: ${{ !contains(github.event.head_commit.message, '/notdeploy') }}
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ github.event.repository.name }}
          containerAppEnvironment: ${{ github.event.repository.name }}-env
          imageToDeploy: ${{ env.IMAGE }}:${{ env.SHORT_SHA }}
          registryUrl: ${{ env.REGISTRY }}
          registryUsername: ${{ secrets.REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.REGISTRY_PASSWORD }}
          targetPort: 3000
          ingress: external
          location: 'eastus'

      # 7. Parar y eliminar la Container App apenas terminó el deploy, para
      #    no dejarla corriendo consumiendo créditos de Azure for Students.
      #    Cada push vuelve a crearla desde cero en el paso anterior.
      #    Se saltan junto con el deploy si el commit incluye "/notdeploy".
      - name: Stop Container App
        if: ${{ !contains(github.event.head_commit.message, '/notdeploy') }}
        run: |
          az containerapp stop \
            --name "${{ github.event.repository.name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}"

      - name: Delete Container App
        if: ${{ !contains(github.event.head_commit.message, '/notdeploy') }}
        run: |
          az containerapp delete \
            --name "${{ github.event.repository.name }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --yes

      - name: Logout from Azure
        run: az logout