name: Build and Push to ACR

# Push a main -> automático. workflow_dispatch -> botón "Run workflow" en la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: acringenieria.azurecr.io

permissions:
  contents: read # solo leemos el código; no usamos OIDC, así que no hace falta id-token

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Traer el repo (incluye el Dockerfile de la raíz).
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Nombre de imagen (repo dinámico desde el contexto) + SHA corto de 7 chars.
      #    Se exportan a $GITHUB_ENV para no repetir las expresiones más abajo.
      - name: Set image vars
        run: |
          echo "IMAGE=$REGISTRY/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # 3. Login a Azure con el Service Principal, desde un único secret con el
      #    JSON completo de credenciales (ver formato abajo).
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 4. Login al ACR reutilizando la sesión del paso anterior (mismo SP,
      #    sin usuario admin). ${REGISTRY%%.*} = REGISTRY sin el .azurecr.io
      - name: Login to ACR
        run: az acr login --name "${REGISTRY%%.*}"

      # 5. Build con los dos tags de una sola pasada (una imagen, dos nombres)
      #    y push de ambos: acringenieria.azurecr.io/<repo>:<sha> y :latest
      - name: Build and push
        run: |
          docker build -t "$IMAGE:$SHORT_SHA" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
