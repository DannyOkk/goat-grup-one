name: Build and Push to ACR

# Push a main -> automático. workflow_dispatch -> botón "Run workflow" en la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: acringenieria.azurecr.io

permissions:
  contents: read # solo leemos el código; no usamos OIDC, así que no hace falta id-token

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Traer el repo (incluye el Dockerfile de la raíz).
      - name: Checkout
        uses: actions/checkout@v7

      # 2. Nombre de imagen (repo dinámico desde el contexto) + SHA corto de 7 chars.
      #    Se exportan a $GITHUB_ENV para no repetir las expresiones más abajo.
      - name: Set image vars
        run: |
          echo "IMAGE=$REGISTRY/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      # 3. Login a Azure con el Service Principal usando AZURE_CREDENTIALS.
      #    Extraemos campos puntuales para tolerar JSON con comas finales.
      - name: Azure login
        shell: bash
        run: |
          CREDS='${{ secrets.AZURE_CREDENTIALS }}'

          CLIENT_ID="$(echo "$CREDS" | sed -nE 's/.*"clientId"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p')"
          CLIENT_SECRET="$(echo "$CREDS" | sed -nE 's/.*"clientSecret"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p')"
          TENANT_ID="$(echo "$CREDS" | sed -nE 's/.*"tenantId"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p')"
          SUBSCRIPTION_ID="$(echo "$CREDS" | sed -nE 's/.*"subscriptionId"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p')"

          [ -n "$CLIENT_ID" ] && [ -n "$CLIENT_SECRET" ] && [ -n "$TENANT_ID" ] && [ -n "$SUBSCRIPTION_ID" ] \
            || { echo "AZURE_CREDENTIALS no contiene los campos requeridos"; exit 1; }

          az login --service-principal -u "$CLIENT_ID" -p "$CLIENT_SECRET" --tenant "$TENANT_ID"
          az account set --subscription "$SUBSCRIPTION_ID"

      # 4. Login al ACR reutilizando la sesión del paso anterior (mismo SP,
      #    sin usuario admin). ${REGISTRY%%.*} = REGISTRY sin el .azurecr.io
      - name: Login to ACR
        run: az acr login --name "${REGISTRY%%.*}"

      # 5. Build con los dos tags de una sola pasada (una imagen, dos nombres)
      #    y push de ambos: acringenieria.azurecr.io/<repo>:<sha> y :latest
      - name: Build and push
        run: |
          docker build -t "$IMAGE:$SHORT_SHA" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"
